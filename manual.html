<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Soil Moisture Operating Manual — LGRx.">
    <title>Soil Moisture Operating Manual | LGRx</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .manual-viewer-card {
            background: #ffffff;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            max-width: 1400px;
            margin: 0 auto 1.5rem auto;
        }
        .manual-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 3px solid var(--umich-maize);
            padding-bottom: 0.65rem;
        }
        .manual-header-row h1 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.6rem;
            color: var(--umich-blue);
        }
        .pdf-frame {
            width: 100%;
            height: 85vh;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: #525659;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="branding">
                <a href="index.html">
                    <img src="assets/images/Block_M-Hex.png" alt="University of Michigan Block M Logo">
                </a>
                <div class="branding-text">
                    <h1>LGRx Soil Moisture Network <span class="badge-lgrx">LGRx</span></h1>
                    <p>University of Michigan</p>
                </div>
            </div>
            <nav class="nav-links">
                <a href="index.html">Back to Dashboard</a>
                <a href="assets/manual.pdf" download class="btn-highlight">Download PDF</a>
            </nav>
        </div>
    </header>

    <div class="main-wrapper">
        <div class="manual-viewer-card">
            <div class="manual-header-row">
                <div>
                    <h1>Soil Moisture Operating Manual</h1>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <a href="assets/manual.pdf" target="_blank" class="btn-manual-primary" style="font-size: 0.85rem; padding: 0.5rem 1rem;">Open in New Tab</a>
                    <a href="assets/manual.pdf" download class="btn-manual-secondary" style="font-size: 0.85rem; padding: 0.5rem 1rem; color: var(--umich-blue); border-color: var(--umich-blue);">Download PDF</a>
                </div>
            </div>

            <!-- Embedded Interactive PDF Document Viewer -->
            <iframe class="pdf-frame" src="assets/manual.pdf" title="Soil Moisture Operating Manual PDF">
                <p>Your browser does not support inline PDF viewing. Please <a href="assets/manual.pdf">click here to download the Soil Moisture Operating Manual PDF</a>.</p>
            </iframe>
        </div>
    </div>

    <footer class="footer">
        <p><strong>LGRx Soil Moisture Network</strong> • University of Michigan</p>
    </footer>
</body>
</html>
